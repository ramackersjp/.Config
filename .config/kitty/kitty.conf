include ~/.config/omarchy/current/theme/kitty.conf

# Font
font_family Adwaita Mono
bold_italic_font auto
font_size        13

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Keybindings
# Let Ctrl+Shift+E/O through to nvim (remove kitty defaults: open URL, pass selection)
map ctrl+shift+e no_op
map ctrl+shift+o no_op
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map ctrl+plus increase_font_size
map ctrl+equal increase_font_size
map ctrl+kp_add increase_font_size
map ctrl+minus decrease_font_size
map ctrl+kp_subtract decrease_font_size
map ctrl+backslash reset_font_size

# Right-click: copy selection to clipboard, or paste from clipboard if nothing selected
mouse_map right press ungrabbed
mouse_map right click ungrabbed kitten paste_handler.py

# Allow remote access
allow_remote_control no

# Aesthetics
cursor_shape beam
cursor_blink_interval 0.5
cursor_beam_thickness 1.5
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
