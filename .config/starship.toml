"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](bold #8be9fd)\
$username\
$hostname\
$os\
$container\
$shell\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$cmd_duration\
$time
[╰─](bold #bd93f9)\
$python\
$nodejs\
$rust\
$golang\
$java\
$kotlin\
$php\
$dotnet\
$ruby\
$swift\
$terraform\
$docker_context\
$kubernetes\
$aws\
$azure\
$gcloud\
$env_var\
$direnv\
$nix_shell\
$conda\
$memory_usage\
$battery\
$jobs\
$status\
$character
"""


add_newline = true
scan_timeout = 30
command_timeout = 2000

palette = "custom"

[palettes.custom]
red = "#ff5555"
dark_red = "#cc4444"
baby_blue = "#8be9fd"
light_blue = "#a4ffff"
purple = "#bd93f9"
dark_purple = "#9f6df2"
pink = "#ff79c6"
white = "#f8f8f2"
gray = "#6272a4"
green = "#50fa7b"
yellow = "#f1fa8c"
orange = "#ffb86c"

# -------------------------
# USER / HOST
# -------------------------

[username]
show_always = true
style_user = "bold baby_blue"
style_root = "bold red"
format = "[  $user ]($style)"

[hostname]
ssh_only = false
format = "[@](gray)[󰒋](purple) "
trim_at = "."

[os]
disabled = false
style = "baby_blue"

[os.symbols]
Windows = "󰍲 "
Ubuntu = "󰕈 "
Debian = "󰣚 "
Arch = "󰣇 "
Macos = "󰀵 "
Fedora = "󰣛 "

[shell]
disabled = false
format = "[󰆍](purple) "

# -------------------------
# DIRECTORY
# -------------------------

[directory]
truncation_length = 8
truncate_to_repo = false
fish_style_pwd_dir_length = 1
home_symbol = "~"
read_only = " 󰌾"
style = "bold baby_blue"
format = "[  $path ]($style)[$read_only](red)"

[directory.substitutions]
Documents = "󰈙 Docs"
Downloads = " Downloads"
Projects = "󰲋 Projects"

# -------------------------
# GIT
# -------------------------

[git_branch]
symbol = " "
style = "bold purple"
format = "[ $symbol$branch ]($style)"

[git_commit]
disabled = true
tag_symbol = "  "
commit_hash_length = 8
style = "baby_blue"
format = "[($hash$tag)]($style)"

[git_state]
style = "red"
format = "[\\($state ($progress_current/$progress_total)\\)]($style)"

[git_metrics]
disabled = true
added_style = "green"
deleted_style = "red"
format = "[ +$added ]($added_style)[ -$deleted ]($deleted_style)"

[git_status]
disabled = true
style = "bold red"
format = """
([\
$conflicted\
$ahead_behind\
$up_to_date\
$untracked\
$stashed\
$modified\
$staged\
$renamed\
$deleted\
]($style))
"""

conflicted = "⚔️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "✓"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# -------------------------
# COMMANDS
# -------------------------

[cmd_duration]
disabled = true
min_time = 100
show_milliseconds = true
format = "[󱎫 $duration](yellow)"

[status]
disabled = false
symbol = "✘"
success_symbol = "✔"
format = '[ $symbol $status ](bold red)'

[character]
success_symbol = "[❯](bold baby_blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold purple)"

# -------------------------
# TIME
# -------------------------

[time]
disabled = true
time_format = "%H:%M:%S"
style = "bold white"
format = "[󰥔 $time]($style)"



# -------------------------
# JOBS
# -------------------------

[jobs]
symbol = "󱂬 "
style = "yellow"
number_threshold = 1


# -------------------------
# PYTHON
# -------------------------

[python]
disabled = true
symbol = "🐍 "

# -------------------------
# NODE
# -------------------------

[nodejs]
disabled = true
symbol = " "
style = "green"
format = "[${symbol}${version}](green)"

# -------------------------
# RUST
# -------------------------

[rust]
disabled = true
symbol = " "
style = "orange"

# -------------------------
# GO
# -------------------------

[golang]
disabled = true
symbol = " "
style = "baby_blue"

# -------------------------
# JAVA
# -------------------------

[java]
symbol = " "
style = "red"

# -------------------------
# KOTLIN
# -------------------------

[kotlin]
symbol = " "
style = "purple"

# -------------------------
# PHP
# -------------------------

[php]
symbol = " "
style = "purple"

# -------------------------
# RUBY
# -------------------------

[ruby]
symbol = " "
style = "red"

# -------------------------
# DOTNET
# -------------------------

[dotnet]
symbol = "󰪮 "
style = "purple"

# -------------------------
# SWIFT
# -------------------------

[swift]
symbol = " "
style = "orange"

# -------------------------
# TERRAFORM
# -------------------------

[terraform]
symbol = "󱁢 "
format = "[${symbol}${workspace}](purple)"

# -------------------------
# DOCKER
# -------------------------

[docker_context]
symbol = " "
style = "baby_blue"

# -------------------------
# K8S
# -------------------------

[kubernetes]
disabled = false
symbol = "☸ "
style = "baby_blue"
format = "[${symbol}$context](baby_blue)"

# -------------------------
# AWS
# -------------------------

[aws]
symbol = "󰸏 "
style = "orange"
format = "[${symbol}$profile](orange)"

# -------------------------
# AZURE
# -------------------------

[azure]
disabled = false
format = "[󰠅 $subscription](baby_blue)"

# -------------------------
# GCLOUD
# -------------------------

[gcloud]
disabled = false
format = "[󱇶 $account@$project](purple)"

# -------------------------
# CONDA
# -------------------------

[conda]
symbol = "🅒 "
style = "green"

# -------------------------
# NIX
# -------------------------

[nix_shell]
symbol = " "
style = "baby_blue"

# -------------------------
# DIRENV
# -------------------------

[direnv]
disabled = false
style = "purple"

# -------------------------
# CONTAINER
# -------------------------

[container]
symbol = "⬢ "
style = "red"

# -------------------------
# ENV VARS
# -------------------------

[env_var.DEV_ENV]
format = "[DEV:$env_value](purple) "

[env_var.PROD_ENV]
format = "[PROD:$env_value](red) "

[env_var.TMUX]
format = "[TMUX](baby_blue) "
